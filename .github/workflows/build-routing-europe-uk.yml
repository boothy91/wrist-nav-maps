name: Build Routing - Europe UK

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region ID (leave blank for all UK regions)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build region matrix
        id: matrix
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          if [ -n "$REGION" ]; then
            jq -c --arg id "$REGION" \
              '{include: [ .[] | select(.id == $id) ]}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          else
            jq -c '{include: .}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          fi

          echo "Resolved matrix:"
          cat /tmp/matrix.json

          COUNT="$(jq '.include | length' /tmp/matrix.json)"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No matching region found."
            exit 1
          fi

          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build-routing:
    needs: prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    name: "${{ matrix.name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show region configuration
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
          REGION_PATH: ${{ matrix.path }}
          PBF_URL: ${{ matrix.pbf }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BRouter regional build"
          echo "========================================"
          echo "Name: $REGION_NAME"
          echo "ID:   $REGION_ID"
          echo "Path: $REGION_PATH"
          echo "PBF:  $PBF_URL"
          echo

          if [[ "$PBF_URL" != https://download.geofabrik.de/* ]]; then
            echo "ERROR: Region PBF is not a Geofabrik URL."
            exit 1
          fi

          if [[ "$PBF_URL" != *.osm.pbf ]]; then
            echo "ERROR: Region PBF URL does not end in .osm.pbf."
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            unzip

      - name: Checkout BRouter
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/brouter"

          git clone \
            --depth 1 \
            https://github.com/abrensch/brouter.git \
            "$RUNNER_TEMP/brouter"

          git -C "$RUNNER_TEMP/brouter" fetch \
            --depth 1 \
            origin \
            2f4bcb80d2e28342f282224bf2c6cf741b390553

          git -C "$RUNNER_TEMP/brouter" checkout \
            2f4bcb80d2e28342f282224bf2c6cf741b390553

          echo "BRouter commit:"
          git -C "$RUNNER_TEMP/brouter" log -1 --oneline

      - name: Build BRouter map-creator JAR
        working-directory: ${{ runner.temp }}/brouter
        run: |
          set -euo pipefail

          ./gradlew clean build fatJar \
            --no-daemon \

          JAR="$(
            find brouter-server/build/libs \
              -maxdepth 1 \
              -type f \
              -name '*-all.jar' \
              | head -n 1
          )"

          if [ -z "$JAR" ]; then
            echo "ERROR: BRouter fat JAR was not produced."

            find brouter-server/build/libs \
              -maxdepth 1 \
              -type f \
              -print || true

            exit 1
          fi

          echo "Using BRouter JAR:"
          echo "$JAR"

          cp "$JAR" "$RUNNER_TEMP/brouter.jar"

      - name: Download Geofabrik regional PBF
        env:
          PBF_URL: ${{ matrix.pbf }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/brouter-input"

          PBF_FILE="$(basename "$PBF_URL")"

          echo "Downloading:"
          echo "$PBF_URL"
          echo

          wget \
            --tries=5 \
            --waitretry=15 \
            --retry-connrefused \
            --progress=dot:giga \
            -O "$RUNNER_TEMP/brouter-input/$PBF_FILE" \
            "$PBF_URL"

          if [ ! -s "$RUNNER_TEMP/brouter-input/$PBF_FILE" ]; then
            echo "ERROR: PBF download is empty."
            exit 1
          fi

          echo
          echo "Downloaded:"
          ls -lh "$RUNNER_TEMP/brouter-input/$PBF_FILE"

          echo "PBF_FILE=$PBF_FILE" >> "$GITHUB_ENV"

      - name: Prepare official BRouter map-creation workspace
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/brouter"

          rm -rf mapbuild

          mkdir -p mapbuild
          mkdir -p mapbuild/tmp

          cp "$RUNNER_TEMP/brouter-input/$PBF_FILE" \
            mapbuild/planet-new.osm.pbf

          cp "$RUNNER_TEMP/brouter.jar" \
            mapbuild/brouter.jar

          cp misc/scripts/mapcreation/lookups.dat \
            mapbuild/lookups.dat

          cp misc/scripts/mapcreation/all.brf \
            mapbuild/all.brf

          cp misc/scripts/mapcreation/trekking.brf \
            mapbuild/trekking.brf

          cp misc/scripts/mapcreation/softaccess.brf \
            mapbuild/softaccess.brf

          if [ -f misc/scripts/mapcreation/db_tags.csv.gz ]; then
            cp misc/scripts/mapcreation/db_tags.csv.gz \
              mapbuild/db_tags.csv.gz
          fi

          echo "Map creation workspace:"
          find mapbuild \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

      - name: Run official BRouter OsmFastCutter
        working-directory: ${{ runner.temp }}/brouter/mapbuild
        run: |
          set -euo pipefail

          mkdir -p tmp/nodetiles
          mkdir -p tmp/waytiles
          mkdir -p tmp/waytiles55
          mkdir -p tmp/nodes55

          echo "========================================"
          echo "STEP 1 - OsmFastCutter"
          echo "========================================"

          java \
            -Xmx6144M \
            -Xms6144M \
            -Xmn256M \
            -cp brouter.jar \
            -Ddeletetmpfiles=true \
            -DuseDenseMaps=true \
            btools.util.StackSampler \
            btools.mapcreator.OsmFastCutter \
            lookups.dat \
            tmp/nodetiles \
            tmp/waytiles \
            tmp/nodes55 \
            tmp/waytiles55 \
            tmp/bordernids.dat \
            tmp/relations.dat \
            tmp/restrictions.dat \
            all.brf \
            trekking.brf \
            softaccess.brf \
            planet-new.osm.pbf \
            db_tags.csv.gz

          echo
          echo "OsmFastCutter output:"
          find tmp \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      - name: Run official BRouter PosUnifier
        working-directory: ${{ runner.temp }}/brouter/mapbuild
        run: |
          set -euo pipefail

          mkdir -p tmp/unodes55

          echo "========================================"
          echo "STEP 2 - PosUnifier"
          echo "========================================"

          java \
            -Xmx6144M \
            -Xms6144M \
            -Xmn256M \
            -cp brouter.jar \
            -Ddeletetmpfiles=true \
            -DuseDenseMaps=true \
            btools.util.StackSampler \
            btools.mapcreator.PosUnifier \
            tmp/nodes55 \
            tmp/unodes55 \
            tmp/bordernids.dat \
            tmp/bordernodes.dat

          echo
          echo "PosUnifier output:"
          find tmp/unodes55 \
            -maxdepth 1 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      - name: Run official BRouter WayLinker
        working-directory: ${{ runner.temp }}/brouter/mapbuild
        run: |
          set -euo pipefail

          mkdir -p tmp/segments

          echo "========================================"
          echo "STEP 3 - WayLinker"
          echo "========================================"

          java \
            -Xmx6144M \
            -Xms6144M \
            -Xmn256M \
            -cp brouter.jar \
            -DuseDenseMaps=true \
            -DskipEncodingCheck=true \
            btools.util.StackSampler \
            btools.mapcreator.WayLinker \
            tmp/unodes55 \
            tmp/waytiles55 \
            tmp/bordernodes.dat \
            tmp/restrictions.dat \
            lookups.dat \
            all.brf \
            tmp/segments \
            rd5

          echo
          echo "WayLinker output:"
          find tmp/segments \
            -maxdepth 1 \
            -type f \
            -name '*.rd5' \
            -printf '%f %s bytes\n' \
            | sort

      - name: Verify RD5 files
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
        working-directory: ${{ runner.temp }}/brouter/mapbuild
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERATED RD5 FILES"
          echo "========================================"

          RD5_COUNT="$(
            find tmp/segments \
              -maxdepth 1 \
              -type f \
              -name '*.rd5' \
              | wc -l
          )"

          if [ "$RD5_COUNT" -eq 0 ]; then
            echo "ERROR: No RD5 files were generated."
            echo
            echo "BRouter build directory:"
            find tmp \
              -maxdepth 2 \
              -type f \
              -printf '%p %s bytes\n' \
              | sort

            exit 1
          fi

          echo "Region: $REGION_NAME"
          echo "ID:     $REGION_ID"
          echo
          echo "RD5 files generated: $RD5_COUNT"
          echo

          find tmp/segments \
            -maxdepth 1 \
            -type f \
            -name '*.rd5' \
            -exec ls -lh {} \;

      - name: Package RD5 files
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/${REGION_ID}-rd5"

          mkdir -p "$OUTPUT"

          cp \
            "$RUNNER_TEMP/brouter/mapbuild/tmp/segments/"*.rd5 \
            "$OUTPUT/"

          cat > "$OUTPUT/README.txt" <<EOF
          WristNav BRouter routing data

          Region: $REGION_NAME
          Region ID: $REGION_ID

          OSM source:
          Geofabrik regional .osm.pbf extract

          Map creation:
          BRouter official map-creation pipeline

          Input:
          Regional Geofabrik PBF

          Output:
          Standard BRouter .rd5 segment files

          Polygon clipping:
          None
          EOF

          echo "Packaged RD5:"
          ls -lh "$OUTPUT"

      - name: Upload RD5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-rd5
          path: ${{ runner.temp }}/${{ matrix.id }}-rd5/
          if-no-files-found: error
          retention-days: 30
