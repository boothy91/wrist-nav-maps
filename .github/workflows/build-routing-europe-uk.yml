name: Build Routing - Europe UK

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region ID (leave blank for all UK regions)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          if [ -n "$REGION" ]; then
            jq -c --arg id "$REGION" \
              '{include: [ .[] | select(.id == $id) ]}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          else
            jq -c '{include: .}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          fi

          echo "Resolved build matrix:"
          cat /tmp/matrix.json

          COUNT="$(jq '.include | length' /tmp/matrix.json)"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No matching region found."
            exit 1
          fi

          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build-routing:
    needs: prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    name: "${{ matrix.name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show resolved region
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
          REGION_PATH: ${{ matrix.path }}
          PBF_URL: ${{ matrix.pbf }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Region"
          echo "========================================"
          echo "Name: $REGION_NAME"
          echo "ID:   $REGION_ID"
          echo "Path: $REGION_PATH"
          echo "PBF:  $PBF_URL"
          echo

          if [[ "$PBF_URL" != https://download.geofabrik.de/* ]]; then
            echo "ERROR: PBF URL is not a Geofabrik download URL."
            exit 1
          fi

          if [[ "$PBF_URL" != *.osm.pbf ]]; then
            echo "ERROR: PBF URL does not point to an .osm.pbf file."
            exit 1
          fi

      - name: Prepare directories
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/brouter"
          mkdir -p \
            "$RUNNER_TEMP/brouter/planet" \
            "$RUNNER_TEMP/brouter/tmp" \
            "$RUNNER_TEMP/brouter/segments"

      - name: Download Geofabrik regional PBF
        env:
          PBF_URL: ${{ matrix.pbf }}
          REGION_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          PBF_FILE="$(basename "$PBF_URL")"

          echo "Downloading Geofabrik regional extract:"
          echo "$PBF_URL"
          echo
          echo "Filename: $PBF_FILE"

          wget \
            --tries=5 \
            --waitretry=15 \
            --retry-connrefused \
            --progress=dot:giga \
            -O "$RUNNER_TEMP/brouter/planet/$PBF_FILE" \
            "$PBF_URL"

          echo
          echo "Downloaded PBF:"
          ls -lh "$RUNNER_TEMP/brouter/planet/$PBF_FILE"

          if [ ! -s "$RUNNER_TEMP/brouter/planet/$PBF_FILE" ]; then
            echo "ERROR: Downloaded PBF is empty."
            exit 1
          fi

          echo "PBF_FILE=$PBF_FILE" >> "$GITHUB_ENV"

      - name: Build RD5 routing data
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building BRouter RD5"
          echo "========================================"
          echo "Region: $REGION_NAME"
          echo "ID:     $REGION_ID"
          echo "PBF:    $PBF_FILE"
          echo

          docker pull ghcr.io/mjaschen/brouter-routingdata-builder:5.0.1

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env "PLANET=$PBF_FILE" \
            --env "PLANET_UPDATE=0" \
            --env "JAVA_OPTS=-Xmx6144M -Xms6144M -Xmn256M" \
            --volume "$RUNNER_TEMP/brouter/tmp:/brouter-tmp" \
            --volume "$RUNNER_TEMP/brouter/planet:/planet:ro" \
            --volume "$RUNNER_TEMP/brouter/segments:/segments" \
            ghcr.io/mjaschen/brouter-routingdata-builder:5.0.1

      - name: Verify RD5 output
        env:
          REGION_NAME: ${{ matrix.name }}
          REGION_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RD5 output"
          echo "========================================"

          find "$RUNNER_TEMP/brouter/segments" \
            -maxdepth 1 \
            -type f \
            -name '*.rd5' \
            -print \
            -exec ls -lh {} \;

          RD5_COUNT="$(
            find "$RUNNER_TEMP/brouter/segments" \
              -maxdepth 1 \
              -type f \
              -name '*.rd5' \
              | wc -l
          )"

          echo
          echo "RD5 files generated: $RD5_COUNT"

          if [ "$RD5_COUNT" -eq 0 ]; then
            echo "ERROR: No RD5 files were generated for $REGION_NAME."
            exit 1
          fi

      - name: Package routing data
        env:
          REGION_ID: ${{ matrix.id }}
          REGION_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/${REGION_ID}-rd5"
          mkdir -p "$OUTPUT"

          cp "$RUNNER_TEMP/brouter/segments/"*.rd5 "$OUTPUT/"

          cat > "$OUTPUT/README.txt" <<EOF
          WristNav BRouter routing data

          Region: $REGION_NAME
          Region ID: $REGION_ID

          Source:
          Geofabrik regional OSM PBF

          Build:
          BRouter Routing Data Builder 5.0.1

          Format:
          Standard BRouter .rd5 segment files

          No polygon clipping was applied.
          EOF

          echo "Packaged files:"
          ls -lh "$OUTPUT"

      - name: Upload RD5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-rd5
          path: ${{ runner.temp }}/${{ matrix.id }}-rd5/
          if-no-files-found: error
          retention-days: 30
