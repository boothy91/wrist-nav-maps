name: Build Routing - Europe UK

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region ID (leave blank for all UK regions)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          if [ -n "$REGION" ]; then
            jq -c --arg id "$REGION" \
              '{include: [ .[] | select(.id == $id) ]}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          else
            jq -c '{include: .}' \
              config/regions/regions-europe-uk.json > /tmp/matrix.json
          fi

          cat /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build-routing:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    name: "${{ matrix.name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            osmium-tool \
            wget \
            jq \
            unzip

      - name: Checkout BRouter
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/abrensch/brouter.git \
            /tmp/brouter

      - name: Build BRouter
        working-directory: /tmp/brouter
        run: |
          set -euo pipefail

          ./gradlew clean build fatJar --no-daemon

          JAR="$(find brouter-server/build/libs -maxdepth 1 -type f -name '*-all.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: BRouter fat JAR was not produced."
            find brouter-server/build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "BRouter JAR:"
          echo "$JAR"

          cp "$JAR" /tmp/brouter.jar

      - name: Download OSM PBF
        env:
          PBF_URL: ${{ matrix.pbf }}
        run: |
          set -euo pipefail

          wget \
            --progress=dot:giga \
            -O /tmp/region-source.osm.pbf \
            "$PBF_URL"

          ls -lh /tmp/region-source.osm.pbf

      - name: Download region polygon
        env:
          REGION_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail

          POLY_URL="https://download.geofabrik.de/${REGION_PATH}-free.poly"

          echo "Trying:"
          echo "$POLY_URL"

          if wget -q \
            -O /tmp/region.poly \
            "$POLY_URL"; then
            echo "Downloaded polygon:"
            ls -lh /tmp/region.poly
          else
            echo "No Geofabrik .poly available."
            echo "Using the complete supplied PBF."
            rm -f /tmp/region.poly
          fi

      - name: Prepare routing PBF
        run: |
          set -euo pipefail

          if [ -f /tmp/region.poly ]; then
            echo "Extracting routing area using polygon..."

            osmium extract \
              -p /tmp/region.poly \
              /tmp/region-source.osm.pbf \
              -o /tmp/region-routing.osm.pbf \
              --overwrite

            mv /tmp/region-routing.osm.pbf /tmp/region-source.osm.pbf
          fi

          osmium fileinfo /tmp/region-source.osm.pbf

      - name: Build BRouter RD5 segments
        env:
          REGION_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          WORK=/tmp/brouter-build
          JAR=/tmp/brouter.jar
          PROFILES=/tmp/brouter/misc/profiles2
          PBF=/tmp/region-source.osm.pbf

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cd "$WORK"

          mkdir nodetiles
          mkdir ftiles
          mkdir waytiles
          mkdir waytiles55
          mkdir nodes55
          mkdir unodes55
          mkdir segments

          echo "========================================"
          echo "BRouter routing build"
          echo "Region: $REGION_ID"
          echo "PBF:    $PBF"
          echo "========================================"

          echo
          echo "STEP 1 - OsmCutter"
          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -DavoidMapPolling=true \
            btools.mapcreator.OsmCutter \
            "$PROFILES/lookups.dat" \
            nodetiles \
            ways.dat \
            relations.dat \
            restrictions.dat \
            "$PROFILES/all.brf" \
            "$PBF"

          echo
          echo "STEP 2 - NodeFilter"
          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.NodeFilter \
            nodetiles \
            ways.dat \
            ftiles

          echo
          echo "STEP 3 - RelationMerger"
          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.RelationMerger \
            ways.dat \
            ways2.dat \
            relations.dat \
            "$PROFILES/lookups.dat" \
            "$PROFILES/trekking.brf" \
            "$PROFILES/softaccess.brf"

          echo
          echo "STEP 4 - WayCutter"

          for file in ftiles/*.tls; do
            [ -e "$file" ] || continue
            cp "$file" "${file%.tls}.tlf"
          done

          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.WayCutter \
            ftiles \
            ways2.dat \
            waytiles

          echo
          echo "STEP 5 - WayCutter5"

          for file in ftiles/*.tls; do
            [ -e "$file" ] || continue
            cp "$file" "${file%.tls}.ntl"
          done

          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.WayCutter5 \
            ftiles \
            waytiles \
            waytiles55 \
            bordernids.dat

          echo
          echo "STEP 6 - NodeCutter"
          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.NodeCutter \
            ftiles \
            nodes55

          echo
          echo "STEP 7 - PosUnifier"

          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -Ddeletetmpfiles=false \
            -DuseDenseMaps=true \
            btools.mapcreator.PosUnifier \
            nodes55 \
            unodes55 \
            bordernids.dat \
            bordernodes.dat

          echo
          echo "STEP 8 - WayLinker"

          java \
            -Xmx6G \
            -Xms2G \
            -cp "$JAR" \
            -DuseDenseMaps=true \
            -DskipEncodingCheck=true \
            btools.mapcreator.WayLinker \
            unodes55 \
            waytiles55 \
            bordernodes.dat \
            restrictions.dat \
            "$PROFILES/lookups.dat" \
            "$PROFILES/all.brf" \
            segments \
            rd5

          echo
          echo "========================================"
          echo "GENERATED RD5 FILES"
          echo "========================================"

          find segments -type f -name '*.rd5' -print -exec ls -lh {} \;

          COUNT="$(find segments -type f -name '*.rd5' | wc -l)"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No RD5 files were generated."
            exit 1
          fi

          echo
          echo "Generated $COUNT RD5 file(s)."

          mkdir -p /tmp/routing-output
          cp segments/*.rd5 /tmp/routing-output/

      - name: Show routing files
        run: |
          set -euo pipefail

          echo "Routing files for ${{ matrix.id }}:"
          find /tmp/routing-output -type f -name '*.rd5' -print -exec ls -lh {} \;

      - name: Upload routing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routing-${{ matrix.id }}
          path: /tmp/routing-output/*.rd5
          if-no-files-found: error

      - name: Upload routing files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maps-routing-europe-uk
          name: WristNav BRouter Routing - Europe UK
          prerelease: false
          make_latest: false
          files: /tmp/routing-output/*.rd5
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
