name: Build Hillshading - Europe UK

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Only build this region id (e.g. "scotland"). Leave blank to build all.'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        shell: bash
        run: |
          MATRIX=$(python3 << 'EOF'
          import json
          with open("config/regions/regions-europe-uk.json") as f:
              regions = json.load(f)
          only = "${{ github.event.inputs.region }}".strip()
          if only:
              regions = [r for r in regions if r["id"] == only]
          print(json.dumps({"region": regions}))
          EOF
          )
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  ensure-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same up-front pattern as the contours workflow, to avoid the
      # check-then-act race across parallel matrix jobs.
      - name: Ensure hillshade release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view maps-europe-uk-hillshade &>/dev/null || gh release create maps-europe-uk-hillshade \
            --title "Hillshading (SRTM .hgt) - Europe UK" \
            --notes "Per-region zipped SRTM .hgt elevation tiles, for Mapsforge's HillsRenderConfig / MemoryCachingHgtReaderTileSource. Consumed directly by the watch app as an optional overlay layer under the base map - not a replacement map." \
            --latest=false

  build-hillshading:
    needs: [generate-matrix, ensure-releases]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget jq zip unzip

          python3 -m pip install --upgrade pip
          python3 -m pip install "matplotlib<3.5" "numpy<1.22" setuptools beautifulsoup4 lxml
          python3 -m pip install http://katze.tfiu.de/projects/phyghtmap/phyghtmap_2.23.orig.tar.gz

      - name: Fetch region bbox from contours release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          RID="${{ matrix.region.id }}"
          FBASE="${RID//\//-}"

          # Reuse the bbox already computed by the contours workflow instead
          # of recomputing it here - one source of truth for region extents.
          gh release download maps-europe-uk-contours \
            --pattern "${FBASE}.bbox.txt" --output "/tmp/${FBASE}.bbox.txt" --clobber
          cat "/tmp/${FBASE}.bbox.txt"

      - name: Fetch SRTM hillshading tiles and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          RID="${{ matrix.region.id }}"
          FBASE="${RID//\//-}"
          HGT_DIR="/tmp/hgt_cache"
          OUT_ZIP="output/${FBASE}-hillshade.zip"

          mkdir -p output "$HGT_DIR"

          # bbox.txt format from the contours workflow is "S:W:N:E"
          IFS=':' read -r S W N E < "/tmp/${FBASE}.bbox.txt"
          echo "=== ${{ matrix.region.name }} :: bbox $W,$S,$E,$N ==="

          # Re-use phyghtmap's own view3 (viewfinderpanoramas SRTM, void-filled)
          # downloader rather than hand-rolling a second SRTM source - it's
          # already proven working in the contours workflow. We don't care
          # about the contour lines it emits here, only the .hgt tiles it
          # pulls into --hgtdir as a side effect.
          #
          # NOTE: verify phyghtmap's on-disk cache naming (.hgt vs .hgt.zip)
          # the first time this runs - unzip step below assumes .zip and may
          # need adjusting if phyghtmap already leaves them unzipped.
          for attempt in 1 2 3; do
            if phyghtmap --source=view3 --step=100 --pbf \
                --hgtdir="$HGT_DIR" --output-prefix=/tmp/hillshade_probe \
                --jobs="$(nproc)" --area="${W}:${S}:${E}:${N}"; then
              break
            fi
            echo "phyghtmap hgt fetch attempt $attempt failed, retrying in 15s..." >&2
            sleep 15
          done
          rm -f /tmp/hillshade_probe*.osm.pbf

          # Unzip any cached tiles that came down zipped
          find "$HGT_DIR" -name '*.hgt.zip' -exec unzip -o -q -d "$HGT_DIR" {} \;

          HGT_COUNT=$(find "$HGT_DIR" -name '*.hgt' | wc -l)
          if [ "$HGT_COUNT" -eq 0 ]; then
            echo "WARNING: no .hgt tiles found for $RID - skipping upload" >&2
            exit 0
          fi

          echo "Packaging $HGT_COUNT .hgt tile(s)..."
          (cd "$HGT_DIR" && zip -q "/github/workspace/$OUT_ZIP" ./*.hgt)
          ls -lh "$OUT_ZIP"

          for attempt in 1 2 3 4 5; do
            if gh release upload maps-europe-uk-hillshade "$OUT_ZIP" --clobber; then
              break
            fi
            echo "Upload attempt $attempt failed, retrying in 30s..." >&2
            sleep 30
          done
          echo "Uploaded ${FBASE}-hillshade.zip"
