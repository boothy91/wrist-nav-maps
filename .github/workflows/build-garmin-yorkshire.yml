name: Build Garmin - Yorkshire and the Humber

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget unzip

      - name: Download mkgmap
        run: |
          wget -q --tries=5 --waitretry=15 --retry-connrefused \
            https://www.mkgmap.org.uk/download/mkgmap-r4924.zip \
            -O mkgmap.zip
          unzip -q mkgmap.zip -d mkgmap

      - name: Download splitter
        run: |
          wget -q --tries=5 --waitretry=15 --retry-connrefused \
            https://www.mkgmap.org.uk/download/splitter-r654.zip \
            -O splitter.zip
          unzip -q splitter.zip -d splitter

      - name: Download Yorkshire and the Humber
        run: |
          wget -q --timeout=300 --tries=5 --waitretry=15 \
            --retry-connrefused \
            "https://download.openstreetmap.fr/extracts/europe/united_kingdom/england/yorkshire_and_the_humber-latest.osm.pbf" \
            -O yorkshire_and_the_humber.osm.pbf
          ls -lh yorkshire_and_the_humber.osm.pbf

      - name: Split map
        run: |
          mkdir -p split
          SPLITTER=$(find splitter -name 'splitter.jar' | head -1)
          java -Xmx6G -jar "$SPLITTER" \
            --mapid=68000001 \
            --description="Yorkshire and the Humber" \
            --output-dir=split \
            yorkshire_and_the_humber.osm.pbf

      - name: Download elevation (SRTM HGT, auto tiles)
        run: |
          mkdir -p hgt
          python3 - <<'PY' > hgt_tiles.txt
          import math
          lons, lats = [], []
          for l in open('split/areas.poly'):
              p = l.split()
              if len(p) == 2:
                  try:
                      lons.append(float(p[0])); lats.append(float(p[1]))
                  except ValueError:
                      pass
          for la in range(math.floor(min(lats)), math.floor(max(lats)) + 1):
              for lo in range(math.floor(min(lons)), math.floor(max(lons)) + 1):
                  ns = 'N' if la >= 0 else 'S'
                  ew = 'E' if lo >= 0 else 'W'
                  print('%s%02d%s%03d' % (ns, abs(la), ew, abs(lo)))
          PY
          cat hgt_tiles.txt
          for t in $(cat hgt_tiles.txt); do
            d=${t:0:3}
            curl -sf --retry 5 "https://s3.amazonaws.com/elevation-tiles-prod/skadi/${d}/${t}.hgt.gz" -o "hgt/${t}.hgt.gz" && gunzip -f "hgt/${t}.hgt.gz" || echo "missing ${t}"
          done
          ls -lh hgt

      - name: Build Garmin IMG
        run: |
          mkdir -p output
          find split -maxdepth 2 -type f -printf "%p\n" | sort | head -50
          echo "===== template.args ====="
          cat split/template.args
          MKGMAP=$(find mkgmap -name 'mkgmap.jar' | head -1)
          java -Xmx6G -jar "$MKGMAP" \
            --family-id=6800 \
            --family-name="WristNav Garmin Test" \
            --series-name="Yorkshire and the Humber" \
            --country-abbr=GBR \
            --country-name="United Kingdom" \
            --area-name="Yorkshire and the Humber" \
            --product-id=1 \
            --gmapsupp \
            --dem=hgt \
            --dem-poly=split/areas.poly \
            --dem-dists=3312,13248,26512,53024 \
            --overview-dem-dist=88888 \
            --style-file=garmin-style \
            --output-dir=output \
            -c split/template.args \
            typ.txt

          ls -lh output

      - name: Upload Garmin IMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view garmin-test &>/dev/null || \
            gh release create garmin-test \
              --title "Garmin Test Maps" \
              --notes "Test Garmin IMG map generated from OSMFR Yorkshire and the Humber."

          gh release upload garmin-test output/gmapsupp.img --clobber
