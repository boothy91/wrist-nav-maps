name: Build Maps - Europe 1

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Only build this region id (e.g. "france"). Leave blank to build all.'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        shell: bash
        run: |
          MATRIX=$(python3 << 'EOF'
          import json
          with open("config/regions/regions-europe-1.json") as f:
              regions = json.load(f)
          only = "${{ github.event.inputs.region }}".strip()
          if only:
              regions = [r for r in regions if r["id"] == only]
          print(json.dumps({"region": regions}))
          EOF
          )
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-maps:
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            osmium-tool \
            default-jre \
            wget \
            jq \
            python3

      - name: Setup Osmosis and mapsforge
        run: |
          wget -q --tries=5 --waitretry=15 --retry-connrefused https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip
          unzip -q osmosis-0.49.2.zip -d osmosis_install
          chmod +x osmosis_install/osmosis-0.49.2/bin/osmosis
          echo "OSMOSIS_HOME=$(pwd)/osmosis_install/osmosis-0.49.2" >> $GITHUB_ENV
          mkdir -p $HOME/.openstreetmap/osmosis/plugins
          wget -q --tries=5 --waitretry=15 --retry-connrefused "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar" \
            -O $HOME/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar
          echo "JAVACMD_OPTIONS=-Xmx6500m" >> $GITHUB_ENV

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view maps-europe-1 &>/dev/null || gh release create maps-europe-1 \
            --title "Maps - Europe 1" \
            --notes "Auto-generated .map files for WristNav. Updated monthly." \
            --latest=false

      - name: Download, filter, split and write final map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          RID="${{ matrix.region.id }}"
          FBASE="${RID//\//-}"
          FNAME="${FBASE}.map"
          PBF_URL="${{ matrix.region.pbf }}"
          POLY_URL="${PBF_URL/-latest.osm.pbf/.poly}"

          PBF="/tmp/region.osm.pbf"
          MERGED="/tmp/region_filtered.osm.pbf"
          OUT="output/$FNAME"
          TAG_CONF="/tmp/tag-mapping.xml"
          WORKDIR="/tmp/pieces"

          # auto-split tuning: split when raw PBF exceeds TARGET_PBF_MB or bbox area
          # exceeds TARGET_AREA_DEG2 (whichever calls for more pieces wins), capped at MAX_PIECES
          TARGET_PBF_MB=100
          TARGET_AREA_DEG2=15
          MAX_PIECES=24

          mkdir -p output "$WORKDIR"

          echo "=== ${{ matrix.region.name }} ==="

          download() {
            wget -q --timeout=300 --tries=5 --waitretry=15 --retry-connrefused -O "$1" "$2"
          }

          echo "Downloading PBF..."
          download "$PBF" "$PBF_URL"
          ls -lh "$PBF"
          PBF_SIZE_MB=$(du -m "$PBF" | cut -f1)

          cat << 'XMLEOF' > "$TAG_CONF"
          <?xml version="1.0" encoding="UTF-8"?>
          <tag-mapping xmlns="http://mapsforge.org/tag-mapping"
                       xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                       xsi:schemaLocation="http://mapsforge.org/tag-mapping https://raw.githubusercontent.com/mapsforge/mapsforge/master/resources/tag-mapping.xsd"
                       default-zoom-appear="16" profile-name="default-profile">
            <pois>
              <osm-tag key="place" value="city" zoom-appear="3" />
              <osm-tag key="place" value="town" zoom-appear="7" />
              <osm-tag key="place" value="village" zoom-appear="11" />
              <osm-tag key="place" value="hamlet" zoom-appear="12" />
              <osm-tag key="place" value="suburb" zoom-appear="12" />
              <osm-tag key="place" value="locality" zoom-appear="13" />
              <osm-tag key="natural" value="peak" zoom-appear="12" />
              <osm-tag key="natural" value="saddle" zoom-appear="13" />
              <osm-tag key="tourism" value="viewpoint" zoom-appear="13" />
              <osm-tag key="tourism" value="information" zoom-appear="14" />
              <osm-tag key="tourism" value="alpine_hut" zoom-appear="12" />
              <osm-tag key="tourism" value="camp_site" zoom-appear="13" />
              <osm-tag key="tourism" value="picnic_site" zoom-appear="14" />
              <osm-tag key="amenity" value="drinking_water" zoom-appear="14" />
              <osm-tag key="amenity" value="toilets" zoom-appear="14" />
              <osm-tag key="amenity" value="parking" zoom-appear="13" />
              <osm-tag key="amenity" value="shelter" zoom-appear="13" />
            </pois>
            <ways>
              <osm-tag key="highway" value="motorway" zoom-appear="6" />
              <osm-tag key="highway" value="trunk" zoom-appear="7" />
              <osm-tag key="highway" value="primary" zoom-appear="9" />
              <osm-tag key="highway" value="secondary" zoom-appear="10" />
              <osm-tag key="highway" value="tertiary" zoom-appear="11" />
              <osm-tag key="highway" value="unclassified" zoom-appear="12" />
              <osm-tag key="highway" value="residential" zoom-appear="12" />
              <osm-tag key="highway" value="service" zoom-appear="13" />
              <osm-tag key="highway" value="track" zoom-appear="12" />
              <osm-tag key="highway" value="path" zoom-appear="12" />
              <osm-tag key="highway" value="footway" zoom-appear="13" />
              <osm-tag key="highway" value="cycleway" zoom-appear="12" />
              <osm-tag key="waterway" value="river" zoom-appear="11" />
              <osm-tag key="waterway" value="stream" zoom-appear="13" />
              <osm-tag key="natural" value="water" zoom-appear="10" />
              <osm-tag key="natural" value="wood" zoom-appear="10" />
              <osm-tag key="landuse" value="forest" zoom-appear="10" />
              <osm-tag key="landuse" value="residential" zoom-appear="11" />
              <osm-tag key="railway" value="rail" zoom-appear="10" />
              <osm-tag key="ele" value="*" zoom-appear="12" />
            </ways>
          </tag-mapping>
          XMLEOF

          # --- bbox: poly (retried) with sanity-clamped raw-PBF fallback,
          # and antimeridian-crossing handling ---
          POLY="/tmp/region.poly"
          BBOX=""
          echo "Downloading poly from: $POLY_URL"
          if download "$POLY" "$POLY_URL" && [ -s "$POLY" ]; then
            echo "Poly downloaded successfully"
            BBOX=$(python3 - << 'PYEOF'
          import sys
          coords = []
          with open("/tmp/region.poly") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 2:
                      try:
                          coords.append((float(parts[0]), float(parts[1])))
                      except ValueError:
                          pass
          if coords:
              lons = [c[0] for c in coords]
              lats = [c[1] for c in coords]
              raw_span = max(lons) - min(lons)
              shifted = [lo + 360 if lo < 0 else lo for lo in lons]
              shifted_span = max(shifted) - min(shifted)
              if raw_span > 180 and shifted_span < raw_span:
                  east = [(lo, la) for lo, la in coords if lo >= 0]
                  west = [(lo, la) for lo, la in coords if lo < 0]
                  main = east if len(east) >= len(west) else west
                  dropped = len(coords) - len(main)
                  print(f"WARNING: antimeridian crossing detected, dropping {dropped} poly points on the far side (raw span {raw_span:.1f} deg)", file=sys.stderr)
                  lons = [p[0] for p in main]
                  lats = [p[1] for p in main]
              print(f"{min(lons)-0.2:.4f}:{min(lats)-0.2:.4f}:{max(lons)+0.2:.4f}:{max(lats)+0.2:.4f}")
          PYEOF
          )
          fi

          if [ -z "$BBOX" ]; then
            echo "Poly unavailable, falling back to PBF extent"
            FALLBACK_BBOX=$(osmium fileinfo -e --json "$PBF" | jq -r '.data.bbox | "\(.[0]-0.2):\(.[1]-0.2):\(.[2]+0.2):\(.[3]+0.2)"')
            SANE=$(python3 - "$FALLBACK_BBOX" << 'PYEOF'
          import sys
          w, s, e, n = map(float, sys.argv[1].split(":"))
          print("ok" if (e - w) <= 10 and (n - s) <= 10 else "bad")
          PYEOF
          )
            if [ "$SANE" = "bad" ]; then
              echo "ERROR: fallback bbox $FALLBACK_BBOX is implausibly large - likely a mistagged outlier node in the source data. Refusing to proceed against it." >&2
              exit 1
            fi
            BBOX="$FALLBACK_BBOX"
          fi

          echo "Bounding box: $BBOX"
          IFS=':' read -r W S E N <<< "$BBOX"

          # --- decide how many pieces this region needs ---
          PIECES=$(python3 - "$W" "$S" "$E" "$N" "$PBF_SIZE_MB" "$TARGET_PBF_MB" "$TARGET_AREA_DEG2" "$MAX_PIECES" << 'PYEOF'
          import sys, math
          w, s, e, n, pbf_mb, target_mb, target_area, max_pieces = map(float, sys.argv[1:9])
          area = (e - w) * (n - s)
          need = max(pbf_mb / target_mb, area / target_area, 1.0)
          print(min(int(math.ceil(need)), int(max_pieces)))
          PYEOF
          )

          declare -A PIECE_OVERRIDES=()
          if [ -n "${PIECE_OVERRIDES[$RID]:-}" ] && [ "$PIECES" -lt "${PIECE_OVERRIDES[$RID]}" ]; then
            echo "$RID is on the piece-count override list - overriding piece count to ${PIECE_OVERRIDES[$RID]}"
            PIECES=${PIECE_OVERRIDES[$RID]}
          fi

          echo "PBF: ${PBF_SIZE_MB}MB, bbox area: $(python3 -c "print(round(($E-$W)*($N-$S),1))")deg^2 -> $PIECES piece(s)"

          # --- build the list of piece bboxes (split along the longer axis) ---
          BBOX_LIST=$(python3 - "$W" "$S" "$E" "$N" "$PIECES" << 'PYEOF'
          import sys
          w, s, e, n, pieces = float(sys.argv[1]), float(sys.argv[2]), float(sys.argv[3]), float(sys.argv[4]), int(sys.argv[5])
          if pieces <= 1:
              print(f"{w}:{s}:{e}:{n}")
          else:
              width, height = e - w, n - s
              if width >= height:
                  step = width / pieces
                  for i in range(pieces):
                      print(f"{w+i*step}:{s}:{w+(i+1)*step}:{n}")
              else:
                  step = height / pieces
                  for i in range(pieces):
                      print(f"{w}:{s+i*step}:{e}:{s+(i+1)*step}")
          PYEOF
          )

          PIECE_FILES=()
          i=0
          while IFS= read -r PBBOX; do
            [ -z "$PBBOX" ] && continue
            i=$((i+1))
            echo "--- Piece $i/$PIECES, bbox $PBBOX ---"
            if [ "$PIECES" -le 1 ]; then
              SRC="$PBF"
            else
              SRC="$WORKDIR/piece_${i}_clip.osm.pbf"
              # NOTE: osmium extract's default complete_ways strategy does NOT
              # clip ways at this bbox - a way crossing into an adjacent piece
              # is extracted whole into BOTH pieces. That's fine as long as the
              # final recombination step (below) uses osmium merge, which
              # dedupes matching (type, id, version) objects - unlike
              # osmosis --merge, which has no such guarantee and previously
              # produced corrupted long-diagonal-line rendering artifacts
              # where duplicated/overlapping ways got mismerged.
              osmium extract --bbox "$(echo "$PBBOX" | tr ':' ',')" "$PBF" -o "$SRC" --overwrite
            fi
            POUT="$WORKDIR/piece_${i}_filtered.osm.pbf"
            osmium tags-filter "$SRC" \
              w/highway w/waterway w/natural w/landuse w/railway \
              n/place=city,town,village,hamlet,suburb,locality \
              n/railway n/natural=peak,saddle \
              n/tourism=viewpoint,information,alpine_hut,camp_site,picnic_site \
              n/amenity=drinking_water,toilets,parking,shelter \
              r/route=hiking,foot,bicycle,mtb \
              -o "$POUT" --overwrite
            PIECE_FILES+=("$POUT")
          done <<< "$BBOX_LIST"

          if [ "${#PIECE_FILES[@]}" -eq 1 ]; then
            cp "${PIECE_FILES[0]}" "$MERGED"
          else
            echo "Merging ${#PIECE_FILES[@]} pieces with osmium merge (dedupes objects duplicated across piece boundaries)..."
            osmium merge "${PIECE_FILES[@]}" -o "$MERGED" --overwrite
          fi

          ls -lh "$MERGED"
          SIZE_MB=$(du -m "$MERGED" | cut -f1)
          echo "Merged size: ${SIZE_MB}MB"

          # mapfile-writer strictly validates bbox to +/-180 lon, +/-90 lat and
          # throws IllegalArgumentException otherwise - clamp defensively.
          CLAMPED=$(python3 - "$W" "$S" "$E" "$N" << 'PYEOF'
          import sys
          w, s, e, n = map(float, sys.argv[1:5])
          w = max(w, -180.0)
          e = min(e, 180.0)
          s = max(s, -90.0)
          n = min(n, 90.0)
          print(f"{w}:{s}:{e}:{n}")
          PYEOF
          )
          IFS=':' read -r W S E N <<< "$CLAMPED"

          # simplification-factor=1: kept at 1 (not the default 5) to stop
          # mapfile-writer from collapsing curve points into straight vectors.
          CMD="$OSMOSIS_HOME/bin/osmosis --read-pbf file=$MERGED --mw file=$OUT tag-conf-file=$TAG_CONF tag-values=true bbox=$S,$W,$N,$E type=hd simplification-factor=1"
          $CMD
          ls -lh "$OUT"

          for attempt in 1 2 3 4 5; do
            if gh release upload maps-europe-1 "$OUT" --clobber; then
              break
            fi
            echo "Upload attempt $attempt failed, retrying in 30s..." >&2
            sleep 30
          done
          echo "Uploaded $FNAME"

  generate-index:
    needs: build-maps
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate and upload index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, subprocess, os
          from datetime import datetime

          with open("config/regions/regions-europe-1.json") as f:
              regions = json.load(f)

          result = subprocess.run([
              "gh", "release", "view", "maps-europe-1",
              "--json", "assets", "--jq", "[.assets[].name]"
          ], capture_output=True, text=True,
          env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN","")})

          uploaded = json.loads(result.stdout or "[]")
          base_url = "https://github.com/${{ github.repository }}/releases/download/maps-europe-1"

          index = {
              "updated": datetime.now().strftime("%Y-%m-%d"),
              "regions": []
          }

          for region in regions:
              fname = region["id"].replace("/", "-") + ".map"
              if fname in uploaded:
                  index["regions"].append({
                      "id": region["id"],
                      "name": region["name"],
                      "path": region["path"],
                      "url": f"{base_url}/{fname}"
                  })

          os.makedirs("output", exist_ok=True)
          with open("output/index.json", "w") as f:
              json.dump(index, f, indent=2)

          print(f"index.json: {len(index['regions'])} regions")
          EOF

          for attempt in 1 2 3 4 5; do
            if gh release upload maps-europe-1 output/index.json --clobber; then
              break
            fi
            echo "Index upload attempt $attempt failed, retrying in 30s..." >&2
            sleep 30
          done
