name: Build Maps - Europe 1

on:
  schedule:
    - cron: '0 2 6 * *'
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          echo "matrix=$(cat config/regions/regions-europe-1.json | python3 -c "
          import json,sys
          regions = json.load(sys.stdin)
          print(json.dumps({'region': regions}))
          ")" >> $GITHUB_OUTPUT


  build-maps:
    needs: generate-matrix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y osmium-tool default-jre wget python3-pip

      - name: Setup Osmosis and mapsforge
        run: |
          wget -q https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip
          unzip -q osmosis-0.49.2.zip -d osmosis_install
          chmod +x osmosis_install/osmosis-0.49.2/bin/osmosis
          echo "OSMOSIS_HOME=$(pwd)/osmosis_install/osmosis-0.49.2" >> $GITHUB_ENV

          mkdir -p $HOME/.openstreetmap/osmosis/plugins
          wget -q "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar" \
            -O $HOME/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar

          echo "JAVACMD_OPTIONS=-Xmx5500m -XX:+UseG1GC" >> $GITHUB_ENV

      - name: Download, filter and convert
        run: |
          RID="${{ matrix.region.id }}"
          FNAME="${RID//\//-}.map"

          PBF="/tmp/region.osm.pbf"
          FILTERED="/tmp/region_filtered.osm.pbf"
          OUT="output/$FNAME"

          mkdir -p output

          echo "=== ${{ matrix.region.name }} ==="

          wget -q --timeout=300 --tries=2 -O "$PBF" "${{ matrix.region.pbf }}"

          osmium tags-filter "$PBF" \
            w/highway w/waterway w/natural w/landuse w/railway \
            n/place=city,town,village,hamlet,suburb,locality \
            n/railway \
            n/natural=peak,saddle,spring \
            n/tourism=viewpoint,information,alpine_hut,camp_site,picnic_site \
            n/amenity=drinking_water,toilets,parking,shelter,bench,fountain \
            n/man_made=survey_point \
            r/route=hiking,foot,bicycle,mtb \
            -o "$FILTERED" --overwrite

          SIZE_MB=$(du -m "$FILTERED" | cut -f1)
          echo "Filtered size: ${SIZE_MB}MB"

          CMD="$OSMOSIS_HOME/bin/osmosis --rb file=$FILTERED --mw file=$OUT"

          if [ "$SIZE_MB" -gt 80 ]; then
            CMD="$CMD type=hd"
            echo "Using HD mode"
          fi

          $CMD
          ls -lh "$OUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="europe-1-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            --title "Europe 1 Maps - Run $GITHUB_RUN_ID" \
            --notes "Auto-generated maps for Europe 1" \
            --latest=false

          for file in output/*.map; do
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done
