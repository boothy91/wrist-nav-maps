name: Upload Maps - Asia (Release → R2)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget unzip jq python3-pip
          pip3 install boto3

      - name: Download GitHub Release assets (maps-asia)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output

          echo "Fetching release assets list..."

          gh release view maps-asia \
            --json assets \
            --jq '.assets[].name' > files.txt

          echo "Downloading assets..."

          while read file; do
            echo "Downloading $file"
            gh release download maps-asia -p "$file" -D output
          done < files.txt

          ls -lh output

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python3 - << 'EOF'
          import boto3, os

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto"
          )

          bucket = os.environ["R2_BUCKET_NAME"]

          base = "output"
          uploaded = 0

          for root, _, files in os.walk(base):
              for f in files:
                  path = os.path.join(root, f)

                  print(f"Uploading {f}")

                  s3.upload_file(
                      path,
                      bucket,
                      f"asia/{f}",
                      ExtraArgs={"ContentType": "application/octet-stream"}
                  )

                  uploaded += 1

          print(f"Done. Uploaded {uploaded} files.")
          EOF
