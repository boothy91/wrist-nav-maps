name: Build Garmin - East Midlands

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget unzip

      - name: Download mkgmap
        run: |
          wget -q --tries=5 --waitretry=15 --retry-connrefused \
            https://www.mkgmap.org.uk/download/mkgmap-r4924.zip \
            -O mkgmap.zip
          unzip -q mkgmap.zip -d mkgmap

      - name: Download splitter
        run: |
          wget -q --tries=5 --waitretry=15 --retry-connrefused \
            https://www.mkgmap.org.uk/download/splitter-r654.zip \
            -O splitter.zip
          unzip -q splitter.zip -d splitter

      - name: Download East Midlands
        run: |
          wget -q --timeout=300 --tries=5 --waitretry=15 \
            --retry-connrefused \
            "https://download.openstreetmap.fr/extracts/europe/united_kingdom/england/east_midlands-latest.osm.pbf" \
            -O east_midlands.osm.pbf
          ls -lh east_midlands.osm.pbf

      - name: Split map
        run: |
          mkdir -p split
          SPLITTER=$(find splitter -name 'splitter.jar' | head -1)
          java -Xmx6G -jar "$SPLITTER" \
            --mapid=68010001 \
            --description="East Midlands" \
            --output-dir=split \
            east_midlands.osm.pbf

      - name: Build Garmin IMG
        run: |
          mkdir -p output
          find split -maxdepth 2 -type f -printf "%p\n" | sort | head -50
          echo "===== template.args ====="
          cat split/template.args
          MKGMAP=$(find mkgmap -name 'mkgmap.jar' | head -1)
          java -Xmx6G -jar "$MKGMAP" \
            --family-id=6800 \
            --family-name="WristNav Garmin Test" \
            --series-name="East Midlands" \
            --country-abbr=GBR \
            --country-name="United Kingdom" \
            --area-name="East Midlands" \
            --product-id=2 \
            --gmapsupp \
            --merge-lines \
            --style-file=garmin-style \
            --output-dir=output \
            -c split/template.args \
            typ.txt

          cp output/gmapsupp.img output/east_midlands.img
          ls -lh output

      - name: Upload Garmin IMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view garmin-test &>/dev/null || \
            gh release create garmin-test \
              --title "Garmin Test Maps" \
              --notes "Test Garmin IMG maps generated from OSMFR regional extracts."

          gh release upload garmin-test output/east_midlands.img --clobber
