name: Build Maps - Europe UK

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          echo "matrix=$(cat config/regions/regions-europe-uk.json | python3 -c "
          import json,sys
          regions = json.load(sys.stdin)
          print(json.dumps({'region': regions}))
          ")" >> $GITHUB_OUTPUT


  build-maps:
    needs: generate-matrix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:

      - uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y osmium-tool default-jre wget python3-pip
          pip3 install phyghtmap


      - name: Setup Osmosis and mapsforge
        run: |

          wget -q https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip

          unzip -q osmosis-0.49.2.zip -d osmosis_install

          chmod +x osmosis_install/osmosis-0.49.2/bin/osmosis

          echo "OSMOSIS_HOME=$(pwd)/osmosis_install/osmosis-0.49.2" >> $GITHUB_ENV


          mkdir -p $HOME/.openstreetmap/osmosis/plugins


          wget -q \
          "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar" \
          -O $HOME/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar


          echo "JAVACMD_OPTIONS=-Xmx6500m" >> $GITHUB_ENV



      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          gh release view maps-europe-uk &>/dev/null || gh release create maps-europe-uk \
            --title "Maps - Europe UK" \
            --notes "Auto-generated .map files with embedded contours." \
            --latest=false



      - name: Download, filter, add contours and convert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          RID="${{ matrix.region.id }}"
          FNAME="${RID//\//-}.map"

          PBF="/tmp/region.osm.pbf"
          FILTERED="/tmp/region_filtered.osm.pbf"
          MERGED="/tmp/region_with_contours.osm.pbf"

          OUT="output/$FNAME"

          mkdir -p output


          echo "=== ${{ matrix.region.name }} ==="


          wget -q \
          --timeout=300 \
          --tries=2 \
          -O "$PBF" \
          "${{ matrix.region.pbf }}"



          osmium tags-filter "$PBF" \
            w/highway \
            w/waterway \
            w/natural \
            w/landuse \
            w/railway \
            n/place=city,town,village,hamlet,suburb,locality \
            n/railway \
            n/natural=peak,saddle \
            n/tourism=viewpoint,information,alpine_hut,camp_site,picnic_site \
            n/amenity=drinking_water,toilets,parking,shelter \
            r/route=hiking,foot,bicycle,mtb \
            -o "$FILTERED" \
            --overwrite



          echo "Generating contours..."

          phyghtmap \
            --source=view3 \
            --step=10 \
            --pbf \
            --area="${{ matrix.region.bbox }}" \
            --output-prefix=/tmp/contours



          CONTOURS=$(ls /tmp/contours*.osm.pbf | head -1)


          echo "Merging contours..."

          $OSMOSIS_HOME/bin/osmosis \
            --read-pbf file="$FILTERED" \
            --read-pbf file="$CONTOURS" \
            --merge \
            --write-pbf file="$MERGED"



          SIZE_MB=$(du -m "$MERGED" | cut -f1)

          echo "Merged size: ${SIZE_MB}MB"



          CMD="$OSMOSIS_HOME/bin/osmosis --rb file=$MERGED --mw file=$OUT"


          if [ "$SIZE_MB" -gt 150 ]; then
              CMD="$CMD type=hd"
              echo "Using HD mode"
          fi


          $CMD


          ls -lh "$OUT"


          gh release upload maps-europe-uk "$OUT" --clobber



      - name: Generate index
        if: false
        run: echo "Index generated separately"
