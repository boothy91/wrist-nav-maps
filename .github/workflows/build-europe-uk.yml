name: Build Maps - Europe UK

on:
  schedule:
    - cron: '0 2 6 * *'
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          echo "matrix=$(cat config/regions/regions-europe-uk.json | python3 -c "
          import json,sys
          regions = json.load(sys.stdin)
          print(json.dumps({'region': regions}))
          ")" >> $GITHUB_OUTPUT


  build-maps:
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y osmium-tool default-jre wget python3-pip
          pip3 install boto3

      - name: Setup Osmosis and mapsforge
        run: |
          wget -q https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip
          unzip -q osmosis-0.49.2.zip -d osmosis_install
          chmod +x osmosis_install/osmosis-0.49.2/bin/osmosis
          echo "OSMOSIS_HOME=$(pwd)/osmosis_install/osmosis-0.49.2" >> $GITHUB_ENV

          mkdir -p $HOME/.openstreetmap/osmosis/plugins
          wget -q "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar" \
            -O $HOME/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar

          echo "JAVACMD_OPTIONS=-Xmx6500m" >> $GITHUB_ENV

      - name: Download, filter and convert
        run: |
          RID="${{ matrix.region.id }}"
          FNAME="${RID//\//-}.map"

          PBF="/tmp/region.osm.pbf"
          FILTERED="/tmp/region_filtered.osm.pbf"
          OUT="output/$FNAME"

          mkdir -p output

          echo "=== ${{ matrix.region.name }} ==="

          wget -q --timeout=300 --tries=2 -O "$PBF" "${{ matrix.region.pbf }}"

          osmium tags-filter "$PBF" \
            w/highway w/waterway w/natural w/landuse w/railway \
            n/place=city,town,village,hamlet,suburb,locality \
            n/railway \
            n/natural=peak,saddle,spring \
            n/tourism=viewpoint,information,alpine_hut,camp_site,picnic_site \
            n/amenity=drinking_water,toilets,parking,shelter,bench,fountain \
            n/man_made=survey_point \
            r/route=hiking,foot,bicycle,mtb \
            -o "$FILTERED" --overwrite

          SIZE_MB=$(du -m "$FILTERED" | cut -f1)
          echo "Filtered size: ${SIZE_MB}MB"

          CMD="$OSMOSIS_HOME/bin/osmosis --rb file=$FILTERED --mw file=$OUT"

          if [ "$SIZE_MB" -gt 150 ]; then
            CMD="$CMD type=hd"
            echo "Using HD mode"
          fi

          $CMD
          ls -lh "$OUT"

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RID: ${{ matrix.region.id }}
        run: |
          python3 - << 'EOF'
          import boto3, os

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto"
          )

          fname = os.environ["RID"].replace("/", "-") + ".map"
          bucket = os.environ["R2_BUCKET_NAME"]

          print(f"Uploading {fname} to R2...")
          s3.upload_file(
              f"output/{fname}",
              bucket,
              f"europe-uk/{fname}",
              ExtraArgs={"ContentType": "application/octet-stream"}
          )
          print(f"Done: europe-uk/{fname}")
          EOF


  generate-index:
    needs: build-maps
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Install boto3
        run: pip3 install boto3

      - name: Generate and upload index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python3 - << 'EOF'
          import boto3, json, os
          from datetime import datetime

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto"
          )

          bucket = os.environ["R2_BUCKET_NAME"]

          response = s3.list_objects_v2(Bucket=bucket, Prefix="europe-uk/")
          uploaded = [obj["Key"].split("/")[-1] for obj in response.get("Contents", [])]

          with open("config/regions/regions-europe-uk.json") as f:
              regions = json.load(f)

          base_url = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com/{bucket}/europe-uk"

          index = {
              "updated": datetime.now().strftime("%Y-%m-%d"),
              "regions": []
          }

          for region in regions:
              fname = region["id"].replace("/", "-") + ".map"
              if fname in uploaded:
                  index["regions"].append({
                      "id": region["id"],
                      "name": region["name"],
                      "path": region["path"],
                      "url": f"{base_url}/{fname}"
                  })

          print(f"index.json: {len(index['regions'])} regions")

          s3.put_object(
              Bucket=bucket,
              Key="europe-uk/index.json",
              Body=json.dumps(index, indent=2).encode(),
              ContentType="application/json"
          )

          print("index.json uploaded to R2")
          EOF
