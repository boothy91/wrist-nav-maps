name: Build Maps - Europe UK

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        shell: bash
        run: |
          MATRIX=$(python3 << 'EOF'
          import json
          import sys

          with open("config/regions/regions-europe-uk.json") as f:
              regions = json.load(f)

          print(json.dumps({"region": regions}))
          EOF
          )
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-maps:
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            osmium-tool \
            default-jre \
            wget \
            jq \
            python3-gdal \
            gdal-bin \
            build-essential \
            libfreetype6-dev \
            libpng-dev \
            pkg-config \
            libxml2-dev \
            libxslt1-dev

          echo "Installing phyghtmap and Python dependencies..."
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "matplotlib<3.5" \
            "numpy<1.22" \
            setuptools \
            beautifulsoup4 \
            lxml

          python3 -m pip install http://katze.tfiu.de/projects/phyghtmap/phyghtmap_2.23.orig.tar.gz

      - name: Setup Osmosis and mapsforge
        run: |
          wget -q https://github.com/openstreetmap/osmosis/releases/download/0.49.2/osmosis-0.49.2.zip
          unzip -q osmosis-0.49.2.zip -d osmosis_install
          chmod +x osmosis_install/osmosis-0.49.2/bin/osmosis
          echo "OSMOSIS_HOME=$(pwd)/osmosis_install/osmosis-0.49.2" >> $GITHUB_ENV

          mkdir -p $HOME/.openstreetmap/osmosis/plugins
          wget -q "https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar" \
            -O $HOME/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar

          echo "JAVACMD_OPTIONS=-Xmx6500m" >> $GITHUB_ENV

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view maps-europe-uk &>/dev/null || gh release create maps-europe-uk \
            --title "Maps - Europe UK" \
            --notes "Auto-generated .map files for WristNav. Updated monthly." \
            --latest=false

      - name: Download, filter, generate contours and convert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID="${{ matrix.region.id }}"
          FNAME="${RID//\//-}.map"

          PBF="/tmp/region.osm.pbf"
          FILTERED="/tmp/region_filtered.osm.pbf"
          MERGED="/tmp/region_with_contours.osm.pbf"
          OUT="output/$FNAME"
          TAG_POJO="/tmp/tag-mapping.xml"

          mkdir -p output

          echo "=== ${{ matrix.region.name }} ==="
          wget -q --timeout=300 --tries=2 -O "$PBF" "${{ matrix.region.pbf }}"

          echo "Computing exact bounding box..."
          BBOX=$(osmium fileinfo -e --json "$PBF" | jq -r '.data.bbox | "\(.[0]):\(.[1]):\(.[2]):\(.[3])"')
          echo "Using Bounding Box: $BBOX"

          if [ -z "$BBOX" ] || [[ "$BBOX" == *"::"* ]] || [[ "$BBOX" == ":"* ]]; then
            echo "ERROR: Failed to extract a valid bounding box from PBF"
            exit 1
          fi

          echo "Filtering OSM"
          osmium tags-filter "$PBF" \
            w/highway \
            w/waterway \
            w/natural \
            w/landuse \
            w/railway \
            n/place=city,town,village,hamlet,suburb,locality \
            n/railway \
            n/natural=peak,saddle \
            n/tourism=viewpoint,information,alpine_hut,camp_site,picnic_site \
            n/amenity=drinking_water,toilets,parking,shelter \
            r/route=hiking,foot,bicycle,mtb \
            -o "$FILTERED" --overwrite

          echo "Generating contours"
          phyghtmap \
            --source=view3 \
            --step=10 \
            --pbf \
            --area="$BBOX" \
            --output-prefix=/tmp/contours

          CONTOURS=$(ls /tmp/contours*.osm.pbf 2>/dev/null | head -1)
          if [ -z "$CONTOURS" ]; then
            echo "ERROR: No contour file was generated by phyghtmap"
            exit 1
          fi
          echo "Contour file: $CONTOURS"
          ls -lh "$CONTOURS"

          echo "Merging contours"
          $OSMOSIS_HOME/bin/osmosis \
            --read-pbf file="$FILTERED" \
            --read-pbf file="$CONTOURS" \
            --merge \
            --write-pbf file="$MERGED"

          # FIX: Configured tag definitions explicitly targeting correct node/polyline mapsforge expectations
          cat << 'EOF' > "$TAG_POJO"
          <tagmapping>
            <node id="contour" tag="contour" value="elevation" render-type="node" zoom="12" />
            <way id="contour" tag="contour" value="elevation" render-type="polyline" zoom="12" />
          </tagmapping>
          EOF

          SIZE_MB=$(du -m "$MERGED" | cut -f1)
          echo "Merged size: ${SIZE_MB}MB"

          CMD="$OSMOSIS_HOME/bin/osmosis --read-pbf file=$MERGED --mw file=$OUT tag-conf-file=$TAG_POJO"

          if [ "$SIZE_MB" -gt 150 ]; then
            CMD="$CMD type=hd"
            echo "Using HD mode"
          fi

          $CMD
          ls -lh "$OUT"

          gh release upload maps-europe-uk "$OUT" --clobber
          echo "Uploaded $FNAME"

  generate-index:
    needs: build-maps
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate and upload index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, subprocess, os
          from datetime import datetime

          with open("config/regions/regions-europe-uk.json") as f:
              regions = json.load(f)

          result = subprocess.run([
              "gh", "release", "view", "maps-europe-uk",
              "--json", "assets", "--jq", "[.assets[].name]"
          ], capture_output=True, text=True,
          env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN","")})

          uploaded = json.loads(result.stdout or "[]")
          base_url = "https://github.com/${{ github.repository }}/releases/download/maps-europe-uk"

          index = {
              "updated": datetime.now().strftime("%Y-%m-%d"),
              "regions": []
          }

          for region in regions:
              fname = region["id"].replace("/", "-") + ".map"
              if fname in uploaded:
                  index["regions"].append({
                      "id": region["id"],
                      "name": region["name"],
                      "path": region["path"],
                      "url": f"{base_url}/{fname}"
                  })

          os.makedirs("output", exist_ok=True)
          with open("output/index.json", "w") as f:
              json.dump(index, f, indent=2)

          print(f"index.json: {len(index['regions'])} regions")
          EOF

          gh release upload maps-europe-uk output/index.json --clobber
          
