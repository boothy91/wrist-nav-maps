<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WristNav Maps</title>
<style>
:root{
  --bg:#ece0c7;--surface:#f8f2e4;--surface2:#f1e5c9;
  --border:#d8c39a;--brand:#8c6328;--brand-dark:#6e4d20;
  --text:#2b2013;--muted:#6e5a3d;--green:#557a45;
  --orange:#b87927;--red:#a8483a
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.topbar{position:sticky;top:0;z-index:10;background:#f8f2e4eF;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.nav{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;object-fit:cover}
.brand{font-weight:800;font-size:19px}
.nav small{color:var(--muted)}
.nav a{margin-left:auto;color:var(--brand-dark);font-weight:700;text-decoration:none}
main{max-width:1100px;margin:auto;padding:34px 18px 60px}
.hero{display:flex;gap:22px;align-items:center;margin-bottom:28px}
.hero img{width:82px;height:82px;border-radius:20px;box-shadow:0 8px 25px #6e4d2020}
h1{margin:0;font-size:clamp(32px,6vw,52px);letter-spacing:-1.5px}
.hero p{margin:8px 0 0;color:var(--muted);font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:13px 8px;border-radius:13px;font-weight:800;cursor:pointer}
.tab.active{background:var(--brand);color:white;border-color:var(--brand)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px}
.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.section-head h2{margin:0;font-size:22px}
button.refresh{border:1px solid var(--border);background:var(--surface);padding:9px 13px;border-radius:10px;font-weight:700;color:var(--brand-dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}
.card h3{margin:0 0 5px;font-size:18px}
.meta{color:var(--muted);font-size:13px;margin-bottom:15px}
.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px;transition:.3s}.fill.partial{background:var(--orange)}
.status{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted)}
.status strong{color:var(--text)}
.card a{display:inline-block;margin-top:13px;color:var(--brand-dark);font-weight:700;text-decoration:none}
.log{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
@media(max-width:650px){
  .hero{align-items:flex-start}.hero img{width:64px;height:64px}
  .tabs{grid-template-columns:repeat(2,1fr)}
  .summary{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="topbar">
<div class="nav">
<img class="logo" src="https://raw.githubusercontent.com/boothy91/wrist-nav-site/main/ic_launcher.png">
<div><div class="brand">WristNav</div><small>Maps &amp; routing</small></div>
<a href="https://boothy91.github.io/wrist-nav-site/">WristNav site →</a>
</div>
</header>
<main id="main">
<div class="hero">
<img src="https://raw.githubusercontent.com/boothy91/wrist-nav-site/main/ic_launcher.png">
<div><h1>WristNav Maps</h1><p>Live map, terrain and routing data for standalone Wear OS navigation.</p></div>
</div>
<div class="tabs">
<button class="tab active" data-section="maps">Main Map</button>
<button class="tab" data-section="contours">Contours</button>
<button class="tab" data-section="hillshade">Hillshading</button>
<button class="tab" data-section="routing">Routing</button>
</div>
<div class="summary">
<div class="stat"><b id="expected">—</b><span>Expected</span></div>
<div class="stat"><b id="available">—</b><span>Available</span></div>
<div class="stat"><b id="remaining">—</b><span>Remaining</span></div>
<div class="stat"><b id="complete">—</b><span>Complete</span></div>
</div>
<div class="section-head"><h2 id="sectionTitle">Main Map</h2><button class="refresh" onclick="load()">Refresh</button></div>
<div id="cards" class="grid"></div>
<div id="log" class="log">Checking GitHub releases…</div>
<footer>WristNav Maps · Data is generated automatically for WristNav</footer>
</main>
<script>
const OWNER="boothy91",REPO="wrist-nav-maps",BRANCH="main";
const REGIONS={
uk:"regions-europe-uk.json",europe1:"regions-europe-1.json",
europe2:"regions-europe-2.json",africa:"regions-africa.json",
asia:"regions-asia.json",northAmerica:"regions-north-america.json",
others:"regions-others.json"
};
const names={uk:"Europe · UK",europe1:"Europe · 1",europe2:"Europe · 2",
africa:"Africa",asia:"Asia",northAmerica:"North America",others:"Other regions"};
const configs={
maps:["Main Map",["maps-europe-uk","maps-europe-1","maps-europe-2","maps-africa","maps-asia","maps-north-america","maps-others"],".map"],
contours:["Contours",["maps-europe-uk-contours-map","maps-europe-1-contours-map","maps-europe-2-contours-map","maps-africa-contours-map","maps-asia-contours-map","maps-north-america-contours-map","maps-others-contours-map"],".map"],
hillshade:["Hillshading",["maps-europe-uk-hillshade","maps-europe-1-hillshade","maps-europe-2-hillshade","maps-africa-hillshade","maps-asia-hillshade","maps-north-america-hillshade","maps-others-hillshade"],".zip"],
routing:["Routing",["routing-europe-uk","routing-europe-1","routing-europe-2","routing-africa","routing-asia","routing-north-america","routing-others"],".zip"]
};
const regionKeys=["uk","europe1","europe2","africa","asia","northAmerica","others"];
let current="maps";

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 current=b.dataset.section;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
 load();
});

async function json(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error(r.status);
 return r.json();
}

async function load(){
 const [title,tags,ext]=configs[current];
 document.getElementById("sectionTitle").textContent=title;
 const cards=document.getElementById("cards");
 cards.innerHTML="";
 document.getElementById("log").textContent="Checking GitHub releases…";
 let expected=0,available=0,complete=0;

 for(let i=0;i<tags.length;i++){
  const key=regionKeys[i],file=REGIONS[key];
  let count=0,release=null;
  try{
   const data=await json("https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/config/regions/"+file);
   count=Array.isArray(data)?data.length:Object.keys(data).length;
  }catch(e){}
  expected+=count;
  try{release=await json("https://api.github.com/repos/"+OWNER+"/"+REPO+"/releases/tags/"+tags[i])}catch(e){}
  let found=0;
  if(release&&release.assets){
   found=release.assets.filter(a=>a.name.toLowerCase().endsWith(ext)).length;
  }
  available+=found;
  if(count>0&&found>=count)complete++;
  const pct=count?Math.min(100,Math.round(found/count*100)):0;
  cards.insertAdjacentHTML("beforeend",
   `<article class="card"><h3>${names[key]}</h3><div class="meta">${tags[i]}</div>
   <div class="bar"><div class="fill ${pct>=100?"complete":pct>0?"partial":""}" style="width:${pct}%"></div></div>
   <div class="status"><span>${found} of ${count||"?"}</span><strong>${count?pct+"%":"Checking…"}</strong></div>
   ${release?`<div class="meta">Updated ${new Date(release.published_at||release.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</div><a href="${release.html_url}" target="_blank">View release →</a>`:`<div class="meta">Release not found yet</div>`}
   </article>`);
 }
 document.getElementById("expected").textContent=expected||"—";
 document.getElementById("available").textContent=available;
 document.getElementById("remaining").textContent=Math.max(0,expected-available);
 document.getElementById("complete").textContent=complete+"/"+tags.length;
 document.getElementById("log").textContent="Last checked "+new Date().toLocaleString();
}
load();
setInterval(load,120000);
</script>
</body>
</html>
